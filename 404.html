<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f2" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found — Abroad Hub</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .not-found { min-height: 72vh; display: grid; place-items: center; padding: 48px 0; text-align: center; }
      .not-found-inner { max-width: 470px; }
      .not-found-code { margin: 0; color: #77937c; font: 800 clamp(72px, 18vw, 130px)/1 var(--font-display); letter-spacing: -8px; }
      .not-found h1 { margin: 15px 0 10px; font: 700 26px var(--font-display); letter-spacing: -1px; }
      .not-found p { margin: 0 auto 22px; color: #6d7872; font-size: 13px; line-height: 1.7; }
      .not-found .button { display: inline-flex; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Abroad Hub home">
        <span class="brand-mark" aria-hidden="true">a<span>.</span></span>
        <span>abroad<span class="brand-light">hub</span></span>
      </a>
    </header>
    <main class="not-found page-wrap">
      <div class="not-found-inner">
        <p class="not-found-code">404</p>
        <h1>This page took a detour.</h1>
        <p>We couldn't find that page. Head back to Abroad Hub to continue planning your study journey.</p>
        <a class="button button-dark" href="/">Back to Abroad Hub <span aria-hidden="true">↗</span></a>
      </div>
    </main>
  </body>
</html>
